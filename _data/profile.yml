# Homepage bio, one entry per paragraph (HTML allowed).
bio:
  - >-
    I am a Ph.D. student in Computer Science at South Dakota State University, where I work with
    Dr. Ruyi Lian. My research is in geometric computer vision. I develop neural solvers for camera
    pose estimation that hold up under high outlier ratios and image noise, and I build benchmarks
    that test how well visual foundation models understand pose and 3D structure.
  - >-
    Before my Ph.D., I earned a B.Sc. in Information and Communication Technology from Islamic
    University, Bangladesh, and worked as a research assistant at the BUBT Research and Innovation
    Center in Dhaka. That earlier work spans medical image analysis, cybersecurity, and natural
    language processing, with papers in <em>EURASIP Journal on Information Security</em>,
    <em>Array</em> (Elsevier), <em>Bioinformatics and Biology Insights</em>, and <em>Big Data and
    Cognitive Computing</em>.


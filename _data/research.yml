# Research page. A project with `pub: <key>` takes its figure and its Paper / arXiv / Code
# links from that entry in publications.yml; `image` or `links` here add to or override that.

intro: My Ph.D. research is in geometric computer vision. Earlier projects covered medical imaging, cybersecurity, natural language processing and bioinformatics.

groups:
  - title: 3D vision and pose estimation
    intro: Ph.D. research with Dr. Ruyi Lian in the 3D Perception and Scientific Imaging Laboratory at South Dakota State University.
    projects:
      - title: "PoseBench: Probing Pose Awareness in Visual Foundation Models"
        pub: posebench2026
        period: "2026"
        tags: [Visual Foundation Models, Pose Estimation, Benchmark]
        text: >-
          A systematic benchmark that asks whether 2D visual foundation models become pose-aware after
          large-scale pretraining. It probes pretrained features with held-out rendered views and real-image
          queries, and adds pose-graph refinement as a complementary probe. Across 31 public checkpoints from
          10 pretraining families, pose awareness turns out to be an implicit but non-uniform property of
          these models.
      - title: "DeepOnP: Outlier-Resilient Neural Solver for the Orthographic-n-Point Problem"
        pub: deeponp2026
        period: Jan 2026 – present
        tags: [Computer Vision, 3D Geometry, Neural Pose Estimation]
        text: >-
          Neural solvers for camera pose estimation, evaluated under high outlier ratios and image-noise
          perturbations. I investigate top-K hypothesis aggregation and quaternion rotation averaging to
          improve pose stability.

  - title: Medical image analysis
    projects:
      - title: Retinal Vessel Segmentation with Deep Learning
        period: Jan 2026 – May 2026
        tags: [Medical Image Segmentation, U-Net, U-Net++, Transfer Learning]
        text: >-
          Retinal vessel segmentation on the DRIVE and CHASE datasets with U-Net and U-Net++ architectures
          and pretrained backbones, evaluated with Dice, IoU, sensitivity, specificity and accuracy.
      - title: "Advances of AI in Image-Based Computer-Aided Diagnosis: A Review"
        pub: cadreview2024
        period: "2024"
        tags: [Computer-Aided Diagnosis, Medical Imaging, Review]
        text: >-
          A review of AI methods for image-based computer-aided diagnosis: the CAD pipeline from data
          acquisition and preprocessing to segmentation, detection and classification, its use in X-ray,
          MRI, CT and ultrasound imaging, and open problems such as algorithmic limits, big data and
          standardization.

  - title: Earlier work
    intro: Projects from my undergraduate and research-assistant years in Bangladesh.
    projects:
      - title: Ensemble Learning for Phishing Website Detection
        pub: enlem2025
        period: Jan 2022 – Dec 2024
        tags: [Cybersecurity, Explainable Machine Learning, Ensemble Learning]
        text: >-
          Machine learning pipelines for phishing website detection using ensemble-based classification
          strategies, published as EnLeM.
      - title: COVID-19 Twitter Sentiment Analysis
        pub: bdcc2022
        period: Jan 2019 – Jun 2022
        tags: [Natural Language Processing, Social Media Mining, Deep Learning]
        text: >-
          Sentiment analysis models that study public opinion during the COVID-19 pandemic from Twitter
          data. This was my B.Sc. thesis project.
      - title: "High Throughput Biological Sequence Analysis Using Machine Learning-Based Integrative Pipeline for Extracting Functional Annotation and Visualization"
        pub: f1000research2024
        period: "2024"
        tags: [Bioinformatics, Machine Learning, Sequence Analysis]
        text: >-
          A machine-learning-based integrative pipeline for high-throughput biological sequence analysis,
          functional annotation and visualization.
      - title: "Molecular Biomarker Identification Using a Network-Based Bioinformatics Approach that Links COVID-19 with Smoking"
        pub: bbi2023
        period: "2023"
        tags: [Bioinformatics, Network Analysis, Biomarkers]
        text: >-
          Network-based bioinformatics analysis that identifies molecular biomarkers linking COVID-19
          with smoking.
